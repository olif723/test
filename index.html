<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Location</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Location Sharing</h2>
  <p>Tap the button below to display your GPS location on Google Maps.</p>
  
  <button id="get-location-btn">Get My Location</button>
  <p id="status"></p>

  <script>
    const button = document.getElementById('get-location-btn');
    const status = document.getElementById('status');

    button.addEventListener('click', () => {
      // 1. Check if the browser supports the Geolocation API
      if (!navigator.geolocation) {
        status.textContent = 'Geolocation is not supported by your browser.';
        return;
      }

      status.textContent = 'Locating…';

      // 2. Request user permission and get coordinates
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          
          // Display coordinates and a Google Maps link
          status.innerHTML = `
            Success!<br>
            Latitude: ${lat}<br>
            Longitude: ${lon}<br><br>
            <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank">View on Google Maps</a>
          `;

          // OPTIONAL: Send these coordinates to your server/database
          // sendToServer(lat, lon);
        },
        (error) => {
          // Handle cases where the user clicks "Block" or GPS times out
          switch(error.code) {
            case error.PERMISSION_DENIED:
              status.textContent = "User denied the request for Geolocation.";
              break;
            case error.POSITION_UNAVAILABLE:
              status.textContent = "Location information is unavailable.";
              break;
            case error.TIMEOUT:
              status.textContent = "The request to get user location timed out.";
              break;
            default:
              status.textContent = "An unknown error occurred.";
              break;
          }
        }
      );
    });
  </script>
</body>
</html>
